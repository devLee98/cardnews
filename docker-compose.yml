services:
  back:
    build: ./back
    ports:
      - "8000:8000"
    # OPENAI_API_KEY 는 이미지에 굽지 않고 여기서 넘긴다.
    # 키 없이 띄워 볼 수도 있어야 해서 파일이 없어도 통과시킨다 (AI 호출만 503).
    env_file:
      - path: ./back/.env
        required: false

  front:
    build: ./front
    ports:
      - "3000:3000"
    depends_on:
      - back
