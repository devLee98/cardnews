# 배포 서버(EC2)의 nginx 설정.
#
# 이 파일은 서버에 올려서 쓰는 참고본이다. 서버에 이미 설정이 있다면 통째로 갈아끼우지 말고
# location /api/ 블록의 타임아웃 항목만 옮겨 넣어도 된다.
#
# 적용
#   sudo cp deploy/nginx/cardnews.conf /etc/nginx/conf.d/cardnews.conf
#   sudo nginx -t          # 문법 검사
#   sudo systemctl reload nginx

server {
    listen 80;
    server_name _;

    # 업로드하는 공구 JSON 이 수백 KB 가 될 수 있다 (기본값 1MB 는 빠듯하다)
    client_max_body_size 20m;

    # ── 프론트 (Next.js, 3000) ──
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_cache_bypass $http_upgrade;
    }

    # ── 백엔드 (FastAPI, 8000) ──
    # 뒤의 슬래시가 /api 접두사를 떼어 준다. /api/cardnews/plan → /cardnews/plan
    location /api/ {
        proxy_pass http://127.0.0.1:8000/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 카드 구성안 생성은 AI 호출이라 한 번에 30~40초가 걸린다.
        # nginx 기본값(60초)으로는 아슬아슬해서 넉넉히 잡는다.
        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;

        # 응답을 모아뒀다 보내지 않고 오는 대로 흘려보낸다
        proxy_buffering off;
    }
}
