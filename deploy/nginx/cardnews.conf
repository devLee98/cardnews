# 배포 서버(EC2)의 nginx 설정.
#
# 이 파일은 서버에 올려서 쓰는 참고본이다. 서버에 이미 설정이 있다면 통째로 갈아끼우지 말고
# location /api/ 블록의 타임아웃 항목만 옮겨 넣어도 된다.
#
# 적용
#   sudo cp deploy/nginx/cardnews.conf /etc/nginx/conf.d/cardnews.conf
#   sudo nginx -t          # 문법 검사
#   sudo systemctl reload nginx

server {
    listen 80;
    server_name _;

    # 업로드하는 공구 JSON 이 수백 KB 가 될 수 있다 (기본값 1MB 는 빠듯하다)
    client_max_body_size 20m;

    # ── 프론트 (Next.js, 3000) ──
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_cache_bypass $http_upgrade;
    }

    # ── 백엔드 (FastAPI, 8000) ──
    # 뒤의 슬래시가 /api 접두사를 떼어 준다. /api/cardnews/plan → /cardnews/plan
    location /api/ {
        proxy_pass http://127.0.0.1:8000/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # AI 호출이라 오래 걸린다. nginx 기본값은 60초다.
        #
        # 가장 오래 걸리는 것은 문구 생성(/api/cardnews/draft)이다.
        # 카드 9~10장을 한 번에 쓰면서 서로 말이 겹치지 않게 해야 해서
        # 추론 강도가 medium 이고, 실측 120~130초가 나온다.
        # 120초로 두면 딱 경계에 걸쳐서 카드가 많은 공구는 그대로 504 가 난다.
        #
        # 로컬은 nginx 를 거치지 않는다. front/next.config.ts 의 proxyTimeout 이
        # 같은 역할을 하므로 두 값을 함께 맞춘다.
        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;

        # 응답을 모아뒀다 보내지 않고 오는 대로 흘려보낸다
        proxy_buffering off;
    }
}
